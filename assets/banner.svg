<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff9c"/>
      <stop offset="100%" stop-color="#3776ab"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00ff9c"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1e2a45"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <rect width="900" height="260" rx="18" fill="url(#dots)" opacity="0.6"/>
  <rect x="1" y="1" width="898" height="258" rx="17" fill="none" stroke="url(#accent)" stroke-opacity="0.35"/>

  <!-- name / role -->
  <text x="34" y="52" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="url(#titleGrad)" filter="url(#glow)">
    Sunil Kumar Reddy
  </text>
  <text x="34" y="80" font-family="'Fira Code', monospace" font-size="15" fill="#8aa0c4">
    Python Software Engineer · FastAPI · AWS · LangChain
  </text>
  <rect x="34" y="94" width="180" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- terminal window -->
  <g transform="translate(34,116)">
    <rect width="832" height="126" rx="10" fill="#0d1526" stroke="#22314f"/>
    <rect width="832" height="26" rx="10" fill="#141f38"/>
    <rect width="832" height="13" y="13" fill="#141f38"/>
    <circle cx="16" cy="13" r="5" fill="#ff5f57"/>
    <circle cx="34" cy="13" r="5" fill="#febc2e"/>
    <circle cx="52" cy="13" r="5" fill="#28c840"/>
    <text x="78" y="17" font-family="'Fira Code', monospace" font-size="11" fill="#5d7093">sunil@bengaluru:~</text>

    <text font-family="'Fira Code', monospace" font-size="14" fill="#c9d6f0">
      <tspan x="18" y="48" fill="#00ff9c">$</tspan>
      <tspan x="34" y="48"> python -c "print(engineer.philosophy)"</tspan>
    </text>
    <text font-family="'Fira Code', monospace" font-size="14" fill="#8aa0c4" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.35;1" dur="6s" repeatCount="indefinite"/>
      <tspan x="18" y="74">Boring, observable systems beat clever, fragile ones.</tspan>
    </text>
    <text font-family="'Fira Code', monospace" font-size="14" fill="#c9d6f0" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.4;0.5;0.6;1" dur="6s" repeatCount="indefinite"/>
      <tspan x="18" y="100" fill="#00ff9c">$</tspan>
      <tspan x="34" y="100"> _</tspan>
    </text>
    <rect x="42" y="90" width="9" height="14" fill="#00ff9c">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
